# TDD.md §4: lint plus the fastest tests on every commit. Install with `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: make-lint
        name: make lint
        entry: make lint
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: server-fast-tests
        name: server fast tests (no Docker)
        entry: make test-server
        language: system
        pass_filenames: false
        files: ^(server/|protocol/)
        stages: [pre-commit]
      - id: deploy-policy
        name: deploy manifests render and pass policy
        entry: make test-policy
        language: system
        pass_filenames: false
        files: ^server/deploy/
        stages: [pre-commit]
