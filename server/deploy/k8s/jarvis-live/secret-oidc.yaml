# If this 1Password item does not exist yet: create it by running
# np-home-homelab scripts/pocket-id-client/pocket-id-client.sh jarvis-live (config:
# np-home-homelab scripts/pocket-id-client/apps.d/jarvis-live.json) — see
# np-home-homelab docs/pocket-id-client.md. Re-run the same script (with --rotate to mint a
# new secret) to reconcile drift instead of hand-editing this file or the
# 1Password item's fields directly.
#
# The item must have two fields (the operator materializes a Secret named
# "jarvis-live-oidc" whose keys are the 1Password item's field names):
#   client_id     - the OAuth client ID Pocket ID assigns to Jarvis Live
#   client_secret - the OAuth client secret Pocket ID assigns to Jarvis Live
#
# Consumed by deployment.yaml: client_id via secretKeyRef
# (JARVIS_LIVE_OIDC_CLIENT_ID), client_secret mounted at /secrets/oidc for
# JARVIS_LIVE_OIDC_CLIENT_SECRET_FILE. Both references are optional, so the pod
# still starts (device tokens work, sign-in does not) until the item exists.
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: jarvis-live-oidc
spec:
  itemPath: "vaults/HomeLab/items/Jarvis-Live-OIDC-k3s2"
