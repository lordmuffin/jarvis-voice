# Forgejo read token (read:repository), the same 1Password item Flux reads this repo's homelab
# source with (np-home-homelab docs/forgejo.md). The app reads merged PRs with it to close work
# items (workitems/prwatch.py). Live only: lab must not read private repos (policy/lab.rego).
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: forgejo-read-token
spec:
  itemPath: "vaults/HomeLab/items/Forgejo - Flux read token"
