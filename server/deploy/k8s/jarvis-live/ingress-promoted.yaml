# live.apj.dev: the live channel's PRIMARY hostname, promoted from live.lab.apj.dev
# (np-home-homelab docs/service-promotion.md). The base Ingress keeps serving
# live.lab.apj.dev as a second name for the same Service while the promotion
# dual-serves; it is redirected, then retired, in later phases.
#
# Live overlay only: lab stays on live-next.lab.apj.dev and must never answer on
# a live host (Deploy CI checks).
#
# TLS is the shared *.apj.dev wildcard. The `jarvis-live` namespace MUST be in
# BOTH reflector namespace lists in np-home-homelab
# apps/networking/certmanager/resources/apj-dev.yaml, or apj-dev-tls never
# materializes here and Traefik serves its default cert.
#
# Same as base/ingress.yaml: NO forward-auth middleware (WebSocket + bearer-token
# API); auth is app-native.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jarvis-live-promoted
  labels:
    app: jarvis-live
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    external-dns.alpha.kubernetes.io/hostname: live.apj.dev
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    external-dns.alpha.kubernetes.io/ttl: "120"
spec:
  # MUST be traefik-traefik; bare `traefik` does not match.
  ingressClassName: traefik-traefik
  rules:
    - host: live.apj.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jarvis-live
                port:
                  number: 8080
  tls:
    - hosts:
        - live.apj.dev
      secretName: apj-dev-tls
