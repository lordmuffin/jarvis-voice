# Credentials for jarvis-live, synced live from the HomeLab 1Password vault by the
# Connect operator. Every item MUST exist, with a field labelled exactly
# `password` (the label becomes the generated Secret key -- the same rule as
# np-home-homelab apps/ai/capture-pipeline/secret-ingest-token.yaml), before the pods using it
# can start; until then they sit in CreateContainerConfigError.
#
#   jarvis-live-gotify-token  Gotify *application* token for the `jarvis-live` app
#                             (create it in the Gotify UI -> Apps).
#   notes-ro-pat              Fine-grained PAT, resource owner lordmuffin, repository
#                             Notes ONLY, Contents = Read-only and nothing else.
#                             Used by the vault-clone CronJob; it cannot push.
#   notes-vault-pat           The existing read+write PAT the capture namespace
#                             already uses (Contents + Pull requests: Read+Write).
#                             Mounted into the app, which publishes notes as PRs.
#   claude-oauth              Dispatch runs' Claude Code credential: the output of
#                             `claude setup-token` (your Claude subscription), in the
#                             `password` field. Mounted only into a run's claude step,
#                             never into the app. Lasts about a year; rotate it before.
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: jarvis-live-gotify-token
spec:
  itemPath: "vaults/HomeLab/items/jarvis-live-gotify-token"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: notes-ro-pat
spec:
  itemPath: "vaults/HomeLab/items/notes-ro-pat"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: notes-vault-pat
spec:
  itemPath: "vaults/HomeLab/items/notes-vault-pat"
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: claude-oauth
spec:
  itemPath: "vaults/HomeLab/items/claude-oauth"
