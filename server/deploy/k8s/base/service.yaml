---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-live
  labels:
    app: jarvis-live
spec:
  type: ClusterIP
  selector:
    app: jarvis-live
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
