# jarvis-live, shared by both release channels. Not applied on its own: Flux
# applies an overlay, which sets the namespace and adds its Namespace object.
#
#   ../jarvis-live/      live channel: namespace jarvis-live, live.lab.apj.dev,
#                        image pinned by release-please (deployment.yaml).
#   ../jarvis-live-lab/  lab channel: namespace jarvis-live-lab,
#                        live-next.lab.apj.dev, image = the main commit being tested.
#
# See server/deploy/README.md §Release channels.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - onepassword-items.yaml
  - secret-oidc.yaml
  - configmap.yaml
  - pvc-data.yaml
  - pvc-outbox.yaml
  - pvc-vault-clone.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob-vault-clone.yaml
