# Lab's GitHub App for dispatch: "jarvis-dispatch-lab", installed ONLY on
# lordmuffin/jarvis-dispatch-sandbox, with Contents + Pull requests read/write and
# nothing else (no Workflows). Never live's App: lab runs unreleased code. Fields
# (each becomes a key of the generated Secret):
#   private-key       the App's private key (PEM)
#   app-id            the App ID
#   installation-id   the installation ID on lordmuffin
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: jarvis-dispatch-lab-app
spec:
  itemPath: "vaults/HomeLab/items/jarvis-dispatch-lab-app"
