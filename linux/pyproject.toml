[project]
name = "jarvis-desktop"
version = "0.0.0"
description = "Jarvis Voice for the Linux desktop: dictation, tray and Copilot panel"
requires-python = ">=3.12"
dependencies = [
    # The headless capture client (task 10). The desktop app drives it; it is not a second client.
    "jarvis-live",
    # Also a dependency of jarvis-live; listed because evalset and the CLI use it directly.
    "httpx",
    "sherpa-onnx>=2.0.1",
    "numpy>=2.5.4",
]

[project.scripts]
jarvis-voice = "jarvis_desktop.app:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.uv.sources]
jarvis-live = { path = "../server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_desktop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "model: needs an installed speech model (and sometimes a pulled eval set); skipped without",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sherpa_onnx"]  # ships no type information
ignore_missing_imports = true
