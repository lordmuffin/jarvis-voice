name: Release Signed APK

on:
  push:
    tags:
      - 'android-v*'
  # Manual build for an existing tag. Tags created by release-please with the
  # default GITHUB_TOKEN do not fire the push trigger above.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing android release tag to build (e.g. android-v1.6.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Validate tag
        run: |
          case "$RELEASE_TAG" in
            android-v*) ;;
            *) echo "::error::Tag '$RELEASE_TAG' must match android-v*"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/app/keystore.jks

      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_PASSWORD length: ${#KEYSTORE_PASSWORD}"
          echo "KEY_PASSWORD length: ${#KEY_PASSWORD}"
          keytool -list -keystore android/app/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -noprompt
          keytool -certreq -keystore android/app/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -file /dev/null || \
            keytool -certreq -keystore android/app/keystore.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEYSTORE_PASSWORD" -file /dev/null

      - name: Download sherpa-onnx bindings (no model)
        run: bash download-models.sh --no-model

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          version="${RELEASE_TAG#android-v}"
          mv android/app/build/outputs/apk/release/app-release.apk \
             "android/app/build/outputs/apk/release/jarvis-voice-v${version}.apk"
          echo "path=android/app/build/outputs/apk/release/jarvis-voice-v${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}

      # Manual run: the release already exists (made by release-please), so only
      # attach the APK and leave its name and notes alone.
      - name: Attach APK to existing release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.apk.outputs.path }}

  notify:
    needs: release
    uses: ./.github/workflows/notify-gotify.yml
    with:
      title: "jarvis-voice ${{ inputs.tag || github.ref_name }} released"
      message: "Signed APK attached to the GitHub Release."
      priority: 5
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag || github.ref_name }}
    secrets: inherit
