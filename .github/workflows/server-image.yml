name: Server Image

# Build the jarvis-live image, and on a server-v* release tag deploy it.
#
# Deploying is GitOps from this repo: the cluster's Flux follows the branch
# `deploy/live` and applies server/deploy/k8s/jarvis-live from it. The release PR
# (release-please) bumps the image tag in those manifests; merging it tags
# server-vX.Y.Z, this workflow builds and pushes :X.Y.Z, and only then `promote`
# moves deploy/live to that commit -- so Flux never sees a tag before its image
# exists. Roll back (or re-deploy) with "Run workflow" and an earlier tag.

on:
  pull_request:
    paths: ["server/**", "web/**", ".github/workflows/server-image.yml"]
  push:
    branches: [main]
    paths: ["server/**", "web/**", ".github/workflows/server-image.yml"]
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to deploy, e.g. server-v0.9.0 (its image must already be built)"
        required: true
        type: string

env:
  IMAGE: ghcr.io/lordmuffin/jarvis-live

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.tags.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          SHA: ${{ github.sha }}
        run: |
          short="${SHA::7}"
          tags="${IMAGE}:sha-${short}"
          version=""
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#server-v}"
            tags="${IMAGE}:${version}"$'\n'"${tags}"
          fi
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: server
          # The dashboard sources live outside the context; see server/Dockerfile.
          build-contexts: webctx=web
          build-args: |
            WEB_SRC=webctx
            WEB_DIST_SOURCE=web-build
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (read-only root)
        if: github.event_name == 'pull_request'
        env:
          SHA: ${{ github.sha }}
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            -e JARVIS_LIVE_DATA_DIR=/tmp/data -e JARVIS_LIVE_INDEX_DIR=/tmp/idx \
            "${IMAGE}:sha-${SHA::7}" python -c "import jarvis_live.app"
          docker run --rm "${IMAGE}:sha-${SHA::7}" test -f /app/web/dist/index.html

  promote:
    # After the image is pushed (release tag), or on its own (workflow_dispatch).
    if: >-
      !cancelled()
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && ((github.ref_type == 'tag' && startsWith(github.ref_name, 'server-v'))
          || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in server-v*) ;; *) echo "::error::$TAG is not a server-v* tag"; exit 1 ;; esac
          sha=$(git rev-parse --verify "refs/tags/${TAG}^{commit}")
          version="${TAG#server-v}"
          manifest=server/deploy/k8s/jarvis-live/deployment.yaml
          # The manifests at that commit must pin exactly this release's image.
          if ! git show "${sha}:${manifest}" 2>/dev/null | grep -Eq "image: ${IMAGE}:${version}( |$)"; then
            echo "::error::${manifest} at ${TAG} does not pin ${IMAGE}:${version} (releases before the manifests moved here cannot be deployed this way)"
            exit 1
          fi
          {
            echo "tag=${TAG}"
            echo "sha=${sha}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the image exists
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null

      - name: Move deploy/live
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git push --force origin "${SHA}:refs/heads/deploy/live"
          echo "::notice::deploy/live -> ${TAG} (${SHA::7}); Flux applies it within a couple of minutes"

  notify:
    if: ${{ !cancelled() && needs.promote.result != 'skipped' }}
    needs: [build, promote]
    uses: ./.github/workflows/notify-gotify.yml
    with:
      title: "jarvis-live ${{ needs.promote.outputs.tag || inputs.tag || github.ref_name }} ${{ needs.promote.result == 'success' && 'deploying' || 'NOT deployed' }}"
      message: "deploy/live: **${{ needs.promote.result }}**. Flux applies it within a couple of minutes."
      priority: ${{ needs.promote.result == 'success' && 5 || 8 }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
