name: macOS Release

on:
  push:
    tags: ["macos-v*"]

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      app_built: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      - name: Test JarvisLiveKit
        working-directory: macos/JarvisLiveKit
        run: swift test

      - name: Detect app project
        id: detect
        run: |
          if [ -d macos/JarvisVoiceMac ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::macos/JarvisVoiceMac not present yet; skipping app build"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned app
        if: steps.detect.outputs.present == 'true'
        working-directory: macos/JarvisVoiceMac
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ls -d ./*.xcworkspace >/dev/null 2>&1; then
            container=(-workspace "$(ls -d ./*.xcworkspace | head -n1)")
          else
            container=(-project "$(ls -d ./*.xcodeproj | head -n1)")
          fi
          xcodebuild "${container[@]}" -scheme JarvisVoiceMac -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          app=$(find build/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)
          test -n "$app"
          ditto -c -k --keepParent "$app" "JarvisVoiceMac-${REF_NAME#macos-v}-unsigned.zip"

      - name: Attach to GitHub Release
        if: steps.detect.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: macos/JarvisVoiceMac/JarvisVoiceMac-*-unsigned.zip
          fail_on_unmatched_files: true

  notify:
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    needs: release
    uses: ./.github/workflows/notify-gotify.yml
    with:
      title: "jarvis-voice ${{ github.ref_name }} released"
      message: "Tests passed. App build attached: **${{ needs.release.outputs.app_built }}**."
      priority: 5
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    secrets: inherit
