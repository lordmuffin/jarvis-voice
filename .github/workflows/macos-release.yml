name: macOS Release

on:
  push:
    tags: ["macos-v*"]
  # Rebuild an existing release with the current workflow (re-running the tag's own run
  # would reuse the workflow file as it was at that tag).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild, e.g. macos-v0.5.1"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      app_built: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Test JarvisLiveKit
        working-directory: macos/JarvisLiveKit
        run: swift test

      - name: Detect app project
        id: detect
        run: |
          if [ -d macos/JarvisVoiceMac ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::macos/JarvisVoiceMac not present yet; skipping app build"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ad-hoc signed app
        if: steps.detect.outputs.present == 'true'
        working-directory: macos/JarvisVoiceMac
        run: |
          # Not notarized, but sealed with an ad-hoc signature and the entitlements, so macOS keeps
          # the microphone grant instead of asking on every use. See `make release`.
          brew install xcodegen
          make release
          app=$(find build/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)
          test -n "$app"
          ditto -c -k --keepParent "$app" "JarvisVoiceMac-${TAG#macos-v}-unsigned.zip"

      - name: Attach to GitHub Release
        if: steps.detect.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: macos/JarvisVoiceMac/JarvisVoiceMac-*-unsigned.zip
          fail_on_unmatched_files: true

  notify:
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    needs: release
    uses: ./.github/workflows/notify-gotify.yml
    with:
      title: "jarvis-voice ${{ inputs.tag || github.ref_name }} released"
      message: "Tests passed. App build attached: **${{ needs.release.outputs.app_built }}**."
      priority: 5
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag || github.ref_name }}
    secrets: inherit
