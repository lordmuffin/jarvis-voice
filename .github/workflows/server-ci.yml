name: Server CI

on:
  # Push builds main only; branches get CI through their PR, not twice.
  push:
    branches: [main]
    paths: ["server/**", "protocol/**", "prompts/**", ".github/workflows/server-ci.yml"]
  pull_request:
    paths: ["server/**", "protocol/**", "prompts/**", ".github/workflows/server-ci.yml"]

# One run per PR or branch: a newer push cancels the older PR run. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --frozen
      # Uploaded recordings are decoded with ffmpeg (tests/test_upload.py).
      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      # Anonymous registry pulls on shared runners are rate limited (HTTP 429). testcontainers
      # swallows that and fails later with ImageNotFound, so pull here with retries instead.
      - name: Pull Postgres test image
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/pull-test-postgres.sh" "$JARVIS_LIVE_TEST_POSTGRES_IMAGE"
        env:
          JARVIS_LIVE_TEST_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:16-alpine
      - run: uv run pytest -q
        env:
          # Avoid Docker Hub's anonymous pull limit (and the Ryuk image pull) on shared runners.
          JARVIS_LIVE_TEST_POSTGRES_IMAGE: public.ecr.aws/docker/library/postgres:16-alpine
          TESTCONTAINERS_RYUK_DISABLED: "true"

  notify-failure:
    if: failure() && github.ref == 'refs/heads/main'
    needs: check
    uses: ./.github/workflows/notify-gotify.yml
    with:
      title: "Server CI failed on main"
      message: "${{ github.event.head_commit.message }}"
      priority: 7
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets: inherit
