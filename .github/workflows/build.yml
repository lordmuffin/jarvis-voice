name: Build Debug APKs (phone and watch)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''  # default 'tools' package no longer exists in sdkmanager

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Download sherpa-onnx bindings and native libs (no model)
        run: bash download-models.sh --no-model

      - name: Run unit tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-voice-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # assembleDebug above builds every module; the watch APK is the second artifact.
      - name: Upload Wear OS APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-wear-debug
          path: android/wear/build/outputs/apk/debug/wear-debug.apk
          retention-days: 7

  # The Data Layer transfer test runs on a real (emulated) Android runtime. It needs only the
  # shared :wearcommon library, so none of the phone app's native downloads.
  instrumented:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Data Layer transfer test (fake node)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          script: cd android && ./gradlew :wearcommon:connectedDebugAndroidTest --no-daemon
